[project]
name = "secria-cli"
version = "0.1.0"
description = "Secria secrets manager CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "pyyaml>=6.0",
    "platformdirs>=4.3",
]

[project.scripts]
secria = "secria_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1.400"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["secria_cli", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
