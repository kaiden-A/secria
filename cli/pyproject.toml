[project]
name = "secria"
version = "0.1.0"
description = "Secria secrets manager CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Kaiden-A" }]
keywords = ["secrets", "secret-management", "env", "cli", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "ruamel.yaml>=0.19",
    "platformdirs>=4.3",
]

[project.scripts]
secria = "secria_cli.main:app"

[project.urls]
Homepage = "https://github.com/kaiden-A/secria"
Repository = "https://github.com/kaiden-A/secria"
Issues = "https://github.com/kaiden-A/secria/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secria_cli"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1.400"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["secria_cli", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
