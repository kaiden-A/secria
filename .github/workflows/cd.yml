name: CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.APP_NAME }}
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: ${{ vars.APP_NAME }}

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set image tag to short commit SHA
      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.IMAGE_TAG }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}:latest

      # 5. Authenticate to GCP
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 6. Deploy to Cloud Run. Pin the digest (not the tag) because Docker Hub's
      # index and Cloud Run's mirror.gcr.io cache can lag behind a fresh push.
      # Retry only the transient image/rate-limit failures; config errors fail
      # immediately instead of sleeping through five attempts.
      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          delays=(30 60 90 120)
          attempts=$(( ${#delays[@]} + 1 ))

          for attempt in $(seq 1 "$attempts"); do
            echo "Deploy attempt ${attempt}/${attempts} — ${IMAGE}"

            if output=$(gcloud run deploy "$CLOUD_RUN_SERVICE" \
                --image "$IMAGE" \
                --region "$GCP_REGION" \
                --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}" \
                --quiet 2>&1); then
              printf '%s\n' "$output"
              url=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
                --region "$GCP_REGION" --format='value(status.url)')
              echo "url=${url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            printf '%s\n' "$output"

            if ! printf '%s\n' "$output" | grep -Eiq \
              'image .*not found|failed to pull|manifest unknown|toomanyrequests|rate limit|\b429\b'; then
              echo "Non-retryable deploy failure." >&2
              exit 1
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              delay="${delays[$((attempt - 1))]}"
              echo "Image not available yet; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Deploy failed after ${attempts} attempts." >&2
          exit 1

      # 7. Print the deployed URL
      - name: Show deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
