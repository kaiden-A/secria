name: Release CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --directory cli --frozen
      - run: uv run --directory cli ruff check .
      - run: uv run --directory cli pyright
      - run: uv run --directory cli pytest
      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          version=$(uv run --directory cli python -c "from secria_cli import __version__; print(__version__)")
          test "cli-v${version}" = "${GITHUB_REF_NAME}"
      - run: uv build --directory cli --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: cli/dist/*

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist
      - name: Install the built wheel and run it
        shell: bash
        run: |
          uv venv .smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            python=".smoke/Scripts/python.exe"
            secria=".smoke/Scripts/secria.exe"
          else
            python=".smoke/bin/python"
            secria=".smoke/bin/secria"
          fi
          uv pip install --python "$python" dist/*.whl
          "$secria" --version
          "$secria" --help > /dev/null
          "$python" -m secria_cli --version

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist
      - name: Publish to PyPI
        run: uv publish dist/*
